<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago - Burger House</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos específicos para la página de pago */
        .payment-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .payment-container h2 { color: #ff9800; }
        .total-pay { font-size: 2rem; color: #4CAF50; margin: 20px 0; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-pagar { width: 100%; padding: 15px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 1.2rem; cursor: pointer; font-weight: bold; }
        .btn-pagar:hover { background-color: #45a049; }
        .btn-volver { display: inline-block; margin-top: 15px; color: #666; text-decoration: none; }
    </style>
</head>
<body style="background-color: #f4f4f4;">

    <header>
        <h1>🍔 Burger House - Pasarela Segura</h1>
    </header>

    <div class="payment-container">
        <h2>Detalle de tu Pago</h2>
        <p>Total a pagar:</p>
        <div class="total-pay">$<span id="monto-final">0.00</span></div>

        <form onsubmit="procesarPago(event)">
            <div class="form-group">
                <label>Nombre en la tarjeta:</label>
                <input type="text" placeholder="Ej. Juan Pérez" required>
            </div>
            <div class="form-group">
                <label>Número de Tarjeta:</label>
                <input type="text" placeholder="0000 0000 0000 0000" maxlength="16" required>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Vencimiento:</label>
                    <input type="text" placeholder="MM/AA" maxlength="5" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>CVV:</label>
                    <input type="password" placeholder="123" maxlength="3" required>
                </div>
            </div>
            <button type="submit" class="btn-pagar">Pagar Ahora</button>
        </form>
        
        <a href="index.html" class="btn-volver">← Cancelar y volver a la tienda</a>
    </div>

    <script>
        // 1. Al cargar la página, recuperar el total guardado
        document.addEventListener("DOMContentLoaded", () => {
            const totalGuardado = localStorage.getItem('totalBurgerHouse');
            
            if (totalGuardado) {
                document.getElementById('monto-final').textContent = totalGuardado;
            } else {
                // Si alguien entra aquí sin agregar nada, lo devolvemos al inicio
                alert("No hay ningún pedido pendiente.");
                window.location.href = 'index.html';
            }
        });

        // 2. Simular el procesamiento del pago final
        function procesarPago(event) {
            event.preventDefault(); // Evita que la página se recargue

            alert("¡Pago procesado con éxito! 🍔 Tu pedido está en la cocina.");
            
            // Limpiamos el total guardado para la próxima compra
            localStorage.removeItem('totalBurgerHouse');
            
            // Redirigimos de vuelta a la página principal
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
